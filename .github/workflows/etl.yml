name: ETL pipeline

on:
  schedule:
    - cron: "0 20 */2 * *"   # 20:00 UTC, every second day of the month
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: jobs-db
          path: data/jobs.db
          retention-days: 3